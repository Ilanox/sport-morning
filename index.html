<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>באנר – מחר בוקר ספורט</title>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --paper:#f5f8fc;
    --ink:#1d3c88;
    --red:#5494c0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#1b2333;font-family:'Assistant',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .toolbar button{font-family:inherit;font-size:16px;font-weight:600;padding:10px 18px;border:0;border-radius:6px;cursor:pointer;background:var(--paper);color:var(--ink)}
  .toolbar small{color:#aaa;align-self:center}
  .stage{width:min(92vw,540px);aspect-ratio:1080/1350;position:relative}

  /* 1080x1350 (4:5) */
  #banner{
    width:1080px;height:1350px;position:absolute;top:0;right:0;transform-origin:top right;
    background:var(--paper);color:var(--ink);overflow:hidden;
  }

  /* ---------- background layers ---------- */
  .halftone{
    position:absolute;top:-40px;left:-40px;width:620px;height:620px;
    background-image:radial-gradient(circle, var(--ink) 3.2px, transparent 3.6px);
    background-size:22px 22px;opacity:.13;border-radius:50%;
  }
  .halftone.b{top:auto;left:auto;bottom:260px;right:-220px;width:480px;height:480px;opacity:.09}
  .ghost{
    position:absolute;top:330px;right:-120px;width:1400px;transform:rotate(-7deg);
    font-family:'Karantina';font-weight:700;font-size:170px;line-height:.82;white-space:nowrap;
    color:transparent;-webkit-text-stroke:2px rgba(15,42,85,.14);
  }
  .frame{position:absolute;inset:34px;border:3px solid var(--ink);pointer-events:none}
  .tick{position:absolute;width:26px;height:26px;border-color:var(--red);border-style:solid;border-width:0}
  .tick.tr{top:22px;right:22px;border-top-width:8px;border-right-width:8px}
  .tick.tl{top:22px;left:22px;border-top-width:8px;border-left-width:8px}
  .tick.br{bottom:22px;right:22px;border-bottom-width:8px;border-right-width:8px}
  .tick.bl{bottom:22px;left:22px;border-bottom-width:8px;border-left-width:8px}

  /* ---------- content ---------- */
  .content{position:absolute;inset:34px;padding:46px 50px 50px;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center;gap:30px;border-bottom:6px solid var(--ink);padding-bottom:14px}
  .kicker{font-family:'Karantina';font-weight:700;font-size:210px;line-height:1.15;white-space:nowrap;flex:1;min-width:0;padding:0 0 4px}
  .kicker span{color:var(--red)}
  .logo{width:190px;height:190px;flex:none;display:block}
  .rule2{height:2px;background:var(--ink);margin-top:6px}

  .main{
    font-family:'Karantina';font-weight:700;font-size:560px;line-height:.74;color:var(--red);
    letter-spacing:-4px;white-space:nowrap;overflow:hidden;margin-top:40px;padding:0 4px 14px 14px;margin-left:400px;
    text-shadow:12px 12px 0 var(--ink);
  }

.hero{position:absolute;left:60px;top:440px;width:440px;height:522px;z-index:2}
  .track{margin:6px -84px 30px;flex:1;min-height:200px;position:relative}
  .scene{position:absolute;inset:0;width:100%;height:100%;display:none}
  .scene.on{display:block}
  .themes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
  .themes button{font-family:inherit;font-size:15px;font-weight:600;padding:8px 14px;border:2px solid #5494c0;border-radius:20px;cursor:pointer;background:transparent;color:#dce9f8}
  .themes button.on{background:#5494c0;color:#fff}
  .track svg.lanes{position:absolute;left:0;bottom:0;width:100%;height:46%;display:block}
  .cloud{position:absolute;fill:#dce9f8}
  .jet{position:absolute;right:120px;top:30px;width:150px;height:480px;transform:rotate(68deg);transform-origin:50% 22%}
  
  .speed{position:absolute;top:10px;left:470px;display:flex;flex-direction:column;gap:9px}
  .speed i{display:block;height:6px;background:var(--ink);border-radius:3px}

  .fact{position:relative;background:var(--ink);color:var(--paper);padding:40px 46px 44px;display:flex;gap:34px;align-items:flex-start}
  .fact-label{font-family:'Karantina';font-weight:700;font-size:100px;line-height:1.05;color:#86b8dc;white-space:nowrap}
  .fact-text{font-size:42px;line-height:1.3;padding-top:6px}

  [contenteditable]:focus{outline:3px dashed var(--red);outline-offset:6px}
</style>
</head>

<script>
  function setTheme(t){
    document.querySelectorAll('#themes button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    document.querySelectorAll('.scene').forEach(s => s.classList.toggle('on', s.dataset.theme === t));
  }
  document.getElementById('themes').addEventListener('click', e => { if (e.target.dataset.t) setTheme(e.target.dataset.t); });
  if (location.hash) setTheme(location.hash.slice(1));

  const banner = document.getElementById('banner');
  const stage = document.getElementById('stage');
  function fit(){ banner.style.transform = `scale(${stage.clientWidth / 1080})`; }
  window.addEventListener('resize', fit); fit();

  // shrink big words so they always stay on one line
  function fitText(el, maxSize){
    el.style.fontSize = maxSize + 'px';
    let size = maxSize;
    while (el.scrollWidth > el.clientWidth + 1 && size > 40){ size -= 4; el.style.fontSize = size + 'px'; }
  }
  function fitAll(){
    fitText(document.querySelector('.kicker'), 210);
  }
  document.querySelectorAll('.kicker').forEach(e => e.addEventListener('input', fitAll));
  fitAll(); document.fonts.ready.then(fitAll);

  async function downloadPNG(){
    document.activeElement.blur();
    const prev = banner.style.transform;
    banner.style.transform = 'none';
    try{
      await document.fonts.ready;
      const canvas = await html2canvas(banner, {width:1080, height:1350, scale:1});
      const a = document.createElement('a');
      a.download = 'morning-sport-banner.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    } finally { banner.style.transform = prev; }
  }
</script>
